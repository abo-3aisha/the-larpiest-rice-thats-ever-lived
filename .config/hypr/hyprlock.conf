general {
    no_fade_in = false
    no_fade_out = true
    grace = 2
    ignore_empty_input = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    # empty path = draw no image; Hyprland's session_lock_blur supplies the
    # LIVE blurred backdrop, this color just tints it.
    path =
    color = rgba(23, 23, 26, 0.40)
    blur_passes = 3
    blur_size = 9
    noise = 0.02
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.2
    vibrancy_darkness = 0.15
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    outer_color = rgba(233, 100, 58, 0.85)
    inner_color = rgba(23, 23, 26, 0.85)
    font_color = rgba(235, 235, 235, 1.0)
    placeholder_text = <i>Enter password…</i>
    placeholder_color = rgba(235, 235, 235, 0.4)
    fade_on_empty = true
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    halign = center
    valign = center
    position = 0 0
}


/* Widgets managed by lockscreen-style (SUPER+S) */

/* @@lockscreen-widget@@ */
image {
    monitor =
    path = ~/.cache/lockscreen-clockana.png
    size = 300
    reload_time = 5
    reload_cmd = ~/.local/bin/lockclockana
    rounding = 0
    border_size = 0
    halign = center
    valign = top
    position = 0 42
}

/* @@lockscreen-widget@@ */
label {
    monitor =
    text = cmd[update:30000] echo "$(LC_TIME=C date +"%A, %B %d")"
    color = rgba(239, 241, 244, 1.0)
    font_size = 18
    font_family = "JetBrainsMono Nerd Font"
    halign = right
    valign = top
    position = 140 3
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
}

/* @@lockscreen-widget@@ */
label {
    monitor =
    text = cmd[update:3600000] ~/.local/bin/hijri-text
    color = rgba(239, 241, 244, 1.0)
    font_size = 30
    font_family = "JetBrainsMono Nerd Font"
    halign = left
    valign = top
    position = 25 18
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
}

/* @@lockscreen-widget@@ */
label {
    monitor =
    text = cmd[update:30000] ~/.local/bin/prayer-times --next
    color = rgba(239, 241, 244, 1.0)
    font_size = 30
    font_family = "JetBrainsMono Nerd Font"
    halign = center
    valign = bottom
    position = 0 51
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
}
