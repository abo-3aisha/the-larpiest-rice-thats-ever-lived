general {
    no_fade_in = false
    no_fade_out = true
    grace = 2
    ignore_empty_input = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path =
    color = rgba(23, 23, 26, 0.40)
    blur_passes = 3
    blur_size = 9
    noise = 0.02
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.2
    vibrancy_darkness = 0.15
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    outer_color = rgba(233, 100, 58, 0.85)
    inner_color = rgba(23, 23, 26, 0.85)
    font_color = rgba(235, 235, 235, 1.0)
    placeholder_text = <i>Enter password…</i>
    placeholder_color = rgba(235, 235, 235, 0.4)
    fade_on_empty = true
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    halign = center
    valign = center
    position = 0, 0
}


/* Widgets managed by lockscreen-style (SUPER+S) */

/* @@lockscreen-widget@@ */
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/i18n.py format
    color = rgba(239, 241, 244, 1.0)
    font_size = 72
    font_family = "JetBrainsMono Nerd Font"
    halign = left
    valign = top
    position = 718, -77
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
}

