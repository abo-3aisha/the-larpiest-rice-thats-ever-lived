# Cava dock: thin transparent EQ strip for the bottom of the screen.
# Launched by ~/.local/bin/cava-dock (foot -a cava-dock). Reward: 0.35 alpha.

[general]
framerate = 120

[input]
method = pipewire

[output]
method = ncurses
style = centered

[smoothing]
noise_reduction = 85
monstercat = 1
gravity = 60

[eq]
1 = 0.9
2 = 0.9
3 = 0.9
4 = 0.9
5 = 1.0
6 = 1.0

[color]
gradient = 1
gradient_count = 6
gradient_color_1 = '#3a3510'
gradient_color_2 = '#6d6408'
gradient_color_3 = '#a89b00'
gradient_color_4 = '#d7cc00'
gradient_color_5 = '#e6dd66'
gradient_color_6 = '#f2eaa0'

[bar]
bar_width = 3
bar_spacing = 2
bar_height = 16
autosens = 1