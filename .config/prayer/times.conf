# Prayer times config — edit freely; prayer-times reloads it every day.
# All math runs OFFLINE from these values; the internet is only used to
# refresh the coordinates when you travel (prayer-locate, silent on failure).

LAT=35.53130
LON=35.79090

# Calculation method (angles in degrees below the horizon)
FAJR_ANGLE=19.5        # Egyptian
ISHA_ANGLE=17.5        # Egyptian
ASR_FACTOR=1           # 1 = Shafi'i/Jumhur, 2 = Hanafi
DUHA_MIN=20            # minutes after sunrise for Duha (Ishraq)

# Adhan audio played at each event. Drop your azan file here (mp3/ogg/wav).
# The rice ships a copy at ~/.local/share/prayer/adhan.mp3 so a fresh install
# rings out of the box; overwrite it with your own azan.
SOUND=~/.local/share/prayer/adhan.mp3

# Prayer alarm (adhan + notification). Master switch + one switch per prayer.
# ALARM=0 silences everything (all the per-prayer flags are then ignored).
ALARM=1
FAJR_ENABLED=1
DUHA_ENABLED=1
DHUHR_ENABLED=1
ASR_ENABLED=1
MAGHRIB_ENABLED=1
ISHA_ENABLED=1

# Where prayer-locate reports the detected city (informational only).
CITY=Latakia

# Safety for the auto-locate: require BOTH IP-coordinate sources to agree AND
# the detected timezone offset to match the laptop clock before updating.
# VPNs / foreign wifi exit-nodes lie about the IP and would corrupt the
# prayer times otherwise. Set AUTO=0 to never auto-update.
AUTO=1