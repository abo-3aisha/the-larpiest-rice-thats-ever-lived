# kitty - matched to the Contour setup
#
# Colors live in theme.conf and are rewritten by palette.py on every wallpaper
# change, so this file only holds the settings palette.py must not touch.
#
# NOTE: unlike Contour, kitty has NO cursor motion animation setting. The
# glide you get in Contour from cursor_motion_animation_duration does not exist
# here; kitty draws the beam where it belongs. Everything else below mirrors the
# Contour profile.

# --- appearance ---
font_family      monospace
font_size        12.0
background_opacity   0.78
# Blur behind the transparent background is done by Hyprland
# (window rule: class=kitty blur=true); kitty has no native
# background_blur, so there is nothing to enable here.
confirm_os_window_close 0
hide_window_decorations no
window_padding_width 0
remember_window_size  no
inactive_text_alpha  1.0
scrollback_pager less
scrollback_lines  10000

# --- cursor: same bar, no blink, exactly like Contour's profile ---
# The shape is cursor_shape; the cursor COLOR is set in theme.conf.
cursor_shape           block
cursor_trail		10
cursor_trail_start_threeshold 		0
cursor_blink		true

# --- shell: fish, same as the Contour main profile ---
shell fish

# --- input niceties ---
bypass_shell_noop  focus
copy_on_select     no
strip_ansi_escape_codes no
mouse_hide_wait    3.0
